<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Assistant</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'JetBrains Mono', 'Noto Sans JP', system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
      #app { width: 380px; height: 520px; position: relative; background: linear-gradient(180deg, #1e1e2e 0%, #11111b 100%); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05) inset; display: flex; flex-direction: column; }
      #stage { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at 50% 30%, rgba(137,180,250,0.15) 0%, transparent 60%); }
      #canvas { width: 260px; height: 320px; display: block; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.12); }
      #character { position: absolute; inset: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
      #avatar { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #89b4fa, #cba6f7); display: flex; align-items: center; justify-content: center; font-size: 56px; box-shadow: 0 8px 32px rgba(137,180,250,0.4); margin-bottom: 12px; }
      #name { color: #cdd6f4; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
      #subtitle { color: #a6adc8; font-size: 11px; margin-top: 4px; opacity: 0.9; }
      #status { margin-top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); color: #bac2de; font-size: 11px; display: flex; align-items: center; gap: 6px; }
      #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
      #bubble { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 340px; min-width: 200px; padding: 10px 14px; border-radius: 14px; font-size: 11px; line-height: 1.5; word-wrap: break-word; display: none; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
      #controls { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: rgba(0,0,0,0.25); border-top: 1px solid rgba(255,255,255,0.06); font-size: 10px; color: #6c7086; gap: 8px; }
      #controls kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; padding: 2px 6px; border-radius: 4px; color: #cdd6f4; font-family: inherit; font-size: 10px; }
      #mic-btn { width: 36px; height: 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #cdd6f4; font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
      #mic-btn.listening { background: #f38ba8; color: #11111b; border-color: #f38ba8; animation: pulse 1s infinite; }
      #text-input { flex: 1; min-width: 0; height: 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #cdd6f4; font-size: 11px; padding: 0 10px; outline: none; }
      #text-input::placeholder { color: #6c7086; }
      #send-btn { width: 36px; height: 28px; border-radius: 999px; border: 1px solid rgba(137,180,250,0.5); background: #89b4fa; color: #11111b; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="canvas" width="260" height="320"></canvas>
        <div id="character">
          <div id="avatar">🌸</div>
          <div id="name">Castorice</div>
          <div id="subtitle">Muse Spark · 9router</div>
          <div id="status"><span id="status-dot"></span><span id="status-text">IDLE · siap</span></div>
        </div>
        <div id="bubble"></div>
      </div>
      <div id="controls">
        <button id="mic-btn" title="Mic (Super+Space)">🎤</button>
        <input id="text-input" placeholder="ketik pesan..." autocomplete="off" />
        <button id="send-btn" title="Kirim">➤</button>
        <span id="ws-hint">●</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
